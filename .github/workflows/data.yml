name: Build optional example fields

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated field IDs (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: python -m pip install -r python/requirements.txt
      - uses: actions/cache@v4
        with:
          path: /tmp/skywatch-cache
          key: irsa-cutouts-${{ github.run_id }}
          restore-keys: irsa-cutouts-
      - name: Download and align NASA archive images
        working-directory: python
        env:
          SKYWATCH_CACHE: /tmp/skywatch-cache
          FIELD_IDS: ${{ inputs.only }}
        run: python -m pipeline.build --out ../web/data --only "$FIELD_IDS"
      - uses: actions/upload-artifact@v4
        with:
          name: spacecam-example-fields
          path: web/data
          if-no-files-found: error
          retention-days: 14
